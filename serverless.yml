service: shui-api

frameworkVersion: '4'

provider:
  name: aws
  runtime: nodejs24.x
  region: eu-north-1
  stage: dev

  deploymentBucket:
    name: ${file(./local.yml):deploymentBucket}

  iam:
    deploymentRole: ${file(./local.yml):deploymentRole}

    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
          Resource:
            - Fn::GetAtt: [UsersTable, Arn]

        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Scan
          Resource:
            - Fn::GetAtt: [PostsTable, Arn]

  environment:
    USERS_TABLE:
      Ref: UsersTable
    POSTS_TABLE:
      Ref: PostsTable

package:
  patterns:
    - '!local.yml'
    - '!local.yaml'
    - '!local.example.yml'
    - '!.env*'
    - '!.aws/**'
    - '!.serverlessrc'
    - '!**/*.pem'
    - '!**/*.key'
    - '!**/*.p12'
    - '!**/*.pfx'
    - '!**/*accessKeys*.csv'
    - '!**/*credentials*.csv'
    - '!**/credentials'
    - '!**/secrets.*'

functions:
  health:
    handler: src/handlers/health.handler
    events:
      - httpApi:
          path: /health
          method: get

resources:
  Resources:
    UsersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-${sls:stage}-users
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: username
            AttributeType: S
        KeySchema:
          - AttributeName: username
            KeyType: HASH

    PostsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-${sls:stage}-posts
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH